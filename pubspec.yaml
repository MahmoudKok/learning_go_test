name: learning_go_test
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  bloc: ^9.0.0
  equatable: ^2.0.7
  get_it: ^8.2.0
  injectable: ^2.5.1
  json_serializable: ^6.11.0
  flutter_screenutil: ^5.9.3
  easy_localization: ^3.0.8
  json_annotation: ^4.9.0
  dartz: ^0.10.1
  bot_toast: ^4.1.3
  cached_network_image: ^3.4.1
  colorize: ^3.0.0
  connectivity_plus: ^6.1.5
  dio: ^5.9.0
  firebase_core: ^4.0.0
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.0
  go_router: ^16.2.1
  path_provider: ^2.1.5
  retrofit: ^4.7.2
  skeletonizer: ^2.1.0+1
  flutter_svg: ^2.2.0
  lottie: ^3.3.1
  flutter_secure_storage: ^9.2.4
  hive_ce: ^2.11.3
  hive_ce_flutter: ^2.3.2
  drift: ^2.28.1
  drift_flutter: ^0.2.5
  sqlite3_flutter_libs: ^0.5.39

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.7.0
  injectable_generator: ^2.8.1
  retrofit_generator: ^10.0.2
  pretty_dio_logger: ^1.4.0
  hive_ce_generator: ^1.9.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/i18n/
    - assets/lotties/
    #.Env file
    - .env
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins/Poppins-ExtraBold.ttf
          weight: 800
